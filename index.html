<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Redirecting…</title>

    <style>
        body { font-family: sans-serif; padding: 40px; }
    </style>
</head>

<body>
    <h2>正在跳转至您的语言版本…</h2>
    <p>如果未自动跳转，请访问：<a id="fallback-link" href="/en-US/">/en-US/</a></p>

    <script>
        // --- IP 地理位置自动跳转脚本 ---
        
        // **已切换为支持 HTTPS 的稳定备用 API：ipinfo.io**
        const API_URL = 'https://ipinfo.io/json'; 
        
        // 语言区与国家/地区代码的映射表
        const LANGUAGE_MAP = {
            'zh-CN': ['CN', 'HK', 'MO', 'TW'], // 中文区
            'ko-KR': ['KR', 'KP'],             // 韩国, 朝鲜 (韩语区)
            'ja-JP': ['JP'],                   // 日本 (日语区)
            'de-DE': ['DE', 'AT', 'CH'],       // 德语区
        };

        // 默认跳转语言
        const DEFAULT_LANGUAGE_PATH = '/en-US/'; // 英语

        // --- 测试IP列表（保持不变，已在HTML注释中）---
        
        function getRedirectPath(countryCode) {
            const code = countryCode.toUpperCase();
            
            for (const path in LANGUAGE_MAP) {
                if (LANGUAGE_MAP[path].includes(code)) {
                    return '/' + path + '/';
                }
            }
            
            return DEFAULT_LANGUAGE_PATH;
        }

        function handleRedirect() {
            fetch(API_URL)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('API request failed: ' + response.statusText);
                    }
                    return response.json();
                })
                .then(data => {
                    let redirectPath = DEFAULT_LANGUAGE_PATH;

                    // **核心修复：ipinfo.io 使用 'country' 键名，不需要检查 'status'**
                    if (data.country) { 
                        const countryCode = data.country;
                        redirectPath = getRedirectPath(countryCode);
                    }
                    
                    // 执行跳转
                    console.log(`Detected Country: ${data.country || 'Unknown'}. Redirecting to: ${redirectPath}`);
                    document.getElementById('fallback-link').href = redirectPath;
                    window.location.replace(redirectPath);
                })
                .catch(error => {
                    // 错误处理：API请求失败，使用默认路径
                    console.error('IP Detection Error, using default path:', error);
                    document.getElementById('fallback-link').href = DEFAULT_LANGUAGE_PATH;
                    window.location.replace(DEFAULT_LANGUAGE_PATH);
                });
        }

        // 页面加载后立即执行检测和跳转
        // 确保在执行 handleRedirect() 之前移除 meta refresh，避免竞态条件。
        const metaRefresh = document.querySelector('meta[http-equiv="refresh"]');
        if (metaRefresh) {
            metaRefresh.remove();
        }

        handleRedirect();
    </script>
</body>
</html>
