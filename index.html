<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Redirecting…</title>
    <!-- meta-refresh 兜底（5 秒后回退到 /en-US/） -->
    <meta http-equiv="refresh" content="5; url=/en-US/">

    <script>
    /**
     * 调试说明（用于临时调试，请测试后置空 ""）
     *
     * 使用方法：
     *   1) 在文件里把 window.simulateIP 设为目标测试 IP（下方列出的任意一项），例如：
     *        window.simulateIP = "175.45.176.91"; // 模拟朝鲜平壤
     *      然后保存并刷新页面（或在本地打开修改后的文件）。
     *   2) 若之前选择过语言并保存在 localStorage（键 userLang），会优先使用 localStorage，
     *      推荐在测试前运行： localStorage.removeItem('userLang');
     *   3) 建议在 DevTools 的 Network 与 Console 面板查看 GeoIP 请求与脚本日志。
     *
     * 下面是扩充后的【精确到城市】测试 IP 列表（供调试用）。
     * 每行包含： 城市 (国家) — IP — 验证示例 URL（可直接粘到浏览器打开查看 GeoIP 返回）
     *
     * 注意（重要）：
     * - 这些 IP 在公开 GeoIP 数据库中通常会被定位为对应城市，但 GeoIP 的数据库不同，定位结果可能略有差异；
     * - 云/机房/教育网/托管提供商的 IP 有时会被定位到机房或 ISP 注册地，而非用户物理位置；
     * - 测试时建议用多个验证服务交叉确认（ip-api / ipinfo / api.ip.sb / ip2location / iplocation.net 等）。
     *
     * ========================= 中国 / 中文区域 =========================
     * 中国 — 上海 (Shanghai, China)
     *   101.227.255.255
     *   验证:
     *     http://ip-api.com/json/101.227.255.255
     *     https://ipinfo.io/101.227.255.255/json
     *     https://api.ip.sb/geoip/101.227.255.255
     *
     * 中国 — 北京 (Beijing, China)（示例：可替换为你自己想验证的北京 IP）
     *   123.125.71.39  (示例：百度机房，GeoIP 常定位北京)
     *   验证:
     *     http://ip-api.com/json/123.125.71.39
     *     https://ipinfo.io/123.125.71.39/json
     *
     * 香港 (Hong Kong)
     *   203.198.0.1
     *   验证:
     *     http://ip-api.com/json/203.198.0.1
     *     https://ipinfo.io/203.198.0.1/json
     *
     * 澳门 (Macau)
     *   202.175.86.1
     *   验证:
     *     http://ip-api.com/json/202.175.86.1
     *     https://api.ip.sb/geoip/202.175.86.1
     *
     * 台湾 — 台北 (Taipei, Taiwan)
     *   163.29.3.101
     *   验证:
     *     https://ipinfo.io/163.29.3.101/json
     *     https://api.ip.sb/geoip/163.29.3.101
     *
     * ========================= 朝鲜 / 韩语区 =========================
     * 韩国 — 首尔 (Seoul, South Korea)
     *   210.115.173.1
     *   验证:
     *     http://ip-api.com/json/210.115.173.1
     *     https://ipinfo.io/210.115.173.1/json
     *
     * （朝鲜）平壤 — Pyongyang, DPRK
     *   175.45.176.91
     *   验证:
     *     https://ipinfo.io/175.45.176.91
     *     https://api.ip.sb/geoip/175.45.176.91
     *
     * 说明：脚本已将 KP (朝鲜) 与 KR (韩国) 都映射到 ko-KR（即韩语目录），可按需调整。
     *
     * ========================= 日本 =========================
     * 日本 — 东京 (Tokyo, Japan)
     *   133.11.0.1
     *   验证:
     *     http://ip-api.com/json/133.11.0.1
     *     https://ipinfo.io/133.11.0.1/json
     *
     * ========================= 德语区 =========================
     * 德国 — 柏林 (Berlin, Germany)
     *   81.169.145.77
     *   验证:
     *     http://ip-api.com/json/81.169.145.77
     *     https://ipinfo.io/81.169.145.77/json
     *
     * 奥地利 — 维也纳 (Vienna, Austria)
     *   213.150.3.20
     *   验证:
     *     http://ip-api.com/json/213.150.3.20
     *     https://ipinfo.io/213.150.3.20/json
     *
     * ========================= 新加坡 / 东南亚 =========================
     * 新加坡 (Singapore)
     *   103.1.220.1
     *   验证:
     *     http://ip-api.com/json/103.1.220.1
     *     https://ipinfo.io/103.1.220.1/json
     *
     * ========================= 印度次大陆 =========================
     * 印度 — 新德里 (New Delhi, India)
     *   103.16.101.52
     *   验证:
     *     https://ipinfo.io/103.16.101.52
     *     http://ip-api.com/json/103.16.101.52
     *
     * ========================= 美洲 =========================
     * 美国 — 纽约 (New York, USA)
     *   104.131.0.1
     *   验证:
     *     http://ip-api.com/json/104.131.0.1
     *     https://ipinfo.io/104.131.0.1/json
     *
     * 加拿大 — 多伦多 (Toronto, Canada)（示例）
     *   199.232.28.63  (示例：某托管/机房 IP，GeoIP 常定位 Toronto)
     *   验证:
     *     http://ip-api.com/json/199.232.28.63
     *     https://ipinfo.io/199.232.28.63/json
     *
     * ========================= 欧洲其它示例 =========================
     * 英国 — 伦敦 (London, UK)（示例）
     *   51.140.0.1  (示例：某云/机房，可能定位 London)
     *   验证:
     *     http://ip-api.com/json/51.140.0.1
     *     https://ipinfo.io/51.140.0.1/json
     *
     * 法国 — 巴黎 (Paris, France)（示例）
     *   51.15.0.1  (示例：OVH 等，GeoIP 常定位 Paris)
     *   验证:
     *     http://ip-api.com/json/51.15.0.1
     *     https://ipinfo.io/51.15.0.1/json
     *
     * 俄罗斯 — 莫斯科 (Moscow, Russia)（示例）
     *   5.100.0.1  (示例)
     *   验证:
     *     http://ip-api.com/json/5.100.0.1
     *     https://ipinfo.io/5.100.0.1/json
     *
     * ========================= 美洲其它示例 =========================
     * 巴西 — 圣保罗 (Sao Paulo, Brazil)（示例）
     *   177.55.0.1  (示例)
     *   验证:
     *     http://ip-api.com/json/177.55.0.1
     *     https://ipinfo.io/177.55.0.1/json
     *
     * ========================= 非洲 / 中东示例 =========================
     * 南非 — 约翰内斯堡 (Johannesburg, South Africa)（示例）
     *   197.96.0.1  (示例)
     *   验证:
     *     http://ip-api.com/json/197.96.0.1
     *     https://ipinfo.io/197.96.0.1/json
     *
     * 阿联酋 — 迪拜 (Dubai, UAE)（示例）
     *   185.10.0.1  (示例)
     *   验证:
     *     http://ip-api.com/json/185.10.0.1
     *     https://ipinfo.io/185.10.0.1/json
     *
     * ========================= 说明与建议 =========================
     * - 上面带注记为“示例”的 IP（尤其是欧洲/美洲/非洲/中东的示例）是典型的机房/云/ISP 地址，
     *   不保证在所有 GeoIP 数据库下都定位到同一城市，建议你在测试时优先使用“已核实”段（前面明确列出并在脚本历史中验证过的 IP），
     *   并在需要城市级别高度准确性时，通过多家 GeoIP 服务交叉验证。
     * - 若你需要我为每一个“示例”做实时在线核验（获取 api.ip.sb 或 ipinfo 的 JSON 返回并确认 country/city 字段），我可以逐一查询并把结果返回给你（这会进行在线请求验证）。
     *
     * 测试完成后请务必恢复：
     *   window.simulateIP = "";
     *   localStorage.removeItem('userLang'); // 若你想取消记忆的语言选择
     */
    window.simulateIP = "";

    (function () {
      // 配置：语言目录（与仓库目录一致）
      var LANG_PATH = {
        'zh-CN': '/zh-CN/',
        'ko-KR': '/ko-KR/',
        'ja-JP': '/ja-JP/',
        'de-DE': '/de-DE/',
        'en-US': '/en-US/'
      };

      // 国家码 -> 语言 的映射（可扩展）
      var COUNTRY_TO_LANG = {
        'CN': 'zh-CN', 'HK': 'zh-CN', 'MO': 'zh-CN', 'TW': 'zh-CN',
        'KR': 'ko-KR', 'KP': 'ko-KR',
        'JP': 'ja-JP',
        'DE': 'de-DE', 'AT': 'de-DE'
      };

      function normalizePath(p) { return (p || '').replace(/\/+$/, ''); }

      function log() {
        if (console && console.info) console.info.apply(console, arguments);
      }
      function warn() {
        if (console && console.warn) console.warn.apply(console, arguments);
      }

      try {
        var currentPath = normalizePath(location.pathname);
        var langDirs = Object.keys(LANG_PATH).map(function(k){ return normalizePath(LANG_PATH[k]); });
        for (var i=0;i<langDirs.length;i++){
          if (langDirs[i] && currentPath === langDirs[i]) {
            log('已在语言目录下，跳转被阻止:', currentPath);
            return;
          }
        }

        // 1. URL 强制参数 ?lang=xx 优先
        var forcedLang = (function() {
          var m = location.search.match(/[?&]lang=([^&]+)/);
          return m ? decodeURIComponent(m[1]) : '';
        })();
        if (forcedLang && LANG_PATH[forcedLang]) {
          log('检测到 URL 强制语言参数 lang=', forcedLang, '，立即跳转并保存选择');
          try { localStorage.setItem('userLang', forcedLang); } catch(e){}
          try { location.replace(LANG_PATH[forcedLang]); } catch(e){ location.href = LANG_PATH[forcedLang]; }
          return;
        }

        // 2. 如果设置了 simulateIP（调试用），优先使用它，跳过 localStorage
        var simIP = window.simulateIP && String(window.simulateIP).trim();
        if (simIP) {
          log('检测到 simulateIP（调试模式）=', simIP, '，将优先使用 GeoIP 模拟并忽略 localStorage');
        } else {
          // 3. localStorage 中用户选择
          try {
            var stored = localStorage.getItem('userLang');
            if (stored && LANG_PATH[stored]) {
              log('检测到 localStorage.userLang=', stored, '，直接跳转');
              try { location.replace(LANG_PATH[stored]); } catch(e){ location.href = LANG_PATH[stored]; }
              return;
            }
          } catch(e){}
        }

        // 异步 GeoIP 判定（当 simulateIP 存在或无 localStorage 时执行）
        var api = simIP ? 'https://api.ip.sb/geoip/' + encodeURIComponent(simIP) : 'https://api.ip.sb/geoip';
        log('开始 GeoIP 请求:', api);

        // AbortController 超时保护（若环境不支持则不使用）
        var controller = (typeof AbortController !== 'undefined') ? new AbortController() : null;
        var timeoutMs = 2000;
        var timeoutHandle = null;
        if (controller) timeoutHandle = setTimeout(function(){ controller.abort(); }, timeoutMs);

        fetch(api, controller ? { signal: controller.signal } : undefined)
          .then(function (res) {
            if (controller) clearTimeout(timeoutHandle);
            if (!res || !res.ok) throw new Error('HTTP ' + (res && res.status));
            return res.json();
          })
          .then(function (data) {
            log('GeoIP 返回:', data);
            try {
              var cc = (data && data.country_code) ? String(data.country_code).toUpperCase() : '';
              var countryStr = (data && data.country) ? String(data.country).toLowerCase() : '';
              var city = (data && data.city) ? String(data.city).toLowerCase() : '';
              var selectedLang = '';

              if (cc && COUNTRY_TO_LANG[cc]) {
                selectedLang = COUNTRY_TO_LANG[cc];
                log('通过 country_code 映射到语言:', cc, '->', selectedLang);
              } else {
                // 宽松匹配 country 字符串
                if (countryStr.indexOf('china') !== -1 || countryStr.indexOf('hong') !== -1 || countryStr.indexOf('taiwan') !== -1 || countryStr.indexOf('macau') !== -1) {
                  selectedLang = 'zh-CN';
                } else if (countryStr.indexOf('korea') !== -1) {
                  selectedLang = 'ko-KR';
                } else if (countryStr.indexOf('japan') !== -1) {
                  selectedLang = 'ja-JP';
                } else if (countryStr.indexOf('germany') !== -1 || countryStr.indexOf('austria') !== -1) {
                  selectedLang = 'de-DE';
                }
                if (selectedLang) log('通过 country 字符串匹配到语言:', countryStr, '->', selectedLang);
              }

              // 城市级别特殊判定（示例）
              if (!selectedLang && city) {
                if (city.indexOf('pyongyang') !== -1) selectedLang = 'ko-KR';
              }

              // 浏览器语言作为最终回退
              if (!selectedLang) {
                var nav = (navigator.languages && navigator.languages[0]) || navigator.language || '';
                nav = (nav || '').toLowerCase();
                if (nav.indexOf('zh') === 0) selectedLang = 'zh-CN';
                else if (nav.indexOf('ko') === 0) selectedLang = 'ko-KR';
                else if (nav.indexOf('ja') === 0) selectedLang = 'ja-JP';
                else if (nav.indexOf('de') === 0) selectedLang = 'de-DE';
                else selectedLang = 'en-US';
                log('未从 GeoIP 决定语言，使用浏览器语言回退:', nav, '->', selectedLang);
              }

              var targetPath = LANG_PATH[selectedLang] || LANG_PATH['en-US'];
              if (normalizePath(location.pathname) === normalizePath(targetPath)) {
                log('目标路径与当前路径相同，不执行跳转:', targetPath);
                return;
              }

              // 将自动选择记入 localStorage（可避免频繁重定向）
              try { localStorage.setItem('userLang', selectedLang); } catch(e){}

              log('跳转到目标语言路径:', selectedLang, '->', targetPath);
              try { location.replace(targetPath); } catch(e){ location.href = targetPath; }
            } catch (err) {
              warn('处理 GeoIP 返回时出错，保留 meta-refresh 兜底', err);
            }
          })
          .catch(function (err) {
            if (err && err.name === 'AbortError') {
              warn('GeoIP 请求超时（' + timeoutMs + 'ms），将使用浏览器语言或 meta-refresh 兜底');
            } else {
              warn('GeoIP 请求失败，错误:', err && (err.message || err));
            }
            // 失败时尝试使用 navigator.language 做回退（但不覆盖 meta-refresh）
            try {
              var nav2 = (navigator.languages && navigator.languages[0]) || navigator.language || '';
              nav2 = (nav2 || '').toLowerCase();
              var fallback = 'en-US';
              if (nav2.indexOf('zh') === 0) fallback = 'zh-CN';
              else if (nav2.indexOf('ko') === 0) fallback = 'ko-KR';
              else if (nav2.indexOf('ja') === 0) fallback = 'ja-JP';
              else if (nav2.indexOf('de') === 0) fallback = 'de-DE';

              var fallbackPath = LANG_PATH[fallback];
              if (normalizePath(location.pathname) !== normalizePath(fallbackPath)) {
                log('使用浏览器语言回退跳转到:', fallbackPath);
                try { location.replace(fallbackPath); } catch(e){ /* let meta-refresh handle */ }
              }
            } catch (e) { /* noop */ }
          });

      } catch (ex) {
        console.warn('重定向脚本发生异常，交由 meta-refresh 兜底', ex);
      }
    })();
    </script>

    <link rel="canonical" href="/en-US/">
  </head>
  <body>
    <p>正在根据您的位置跳转到对应语言页面… 默认： <a href="/en-US/">/en-US/</a></p>
    <noscript>
      <p>您的浏览器未启用 JavaScript。请点击链接进入: <a href="/en-US/">/en-US/</a></p>
    </noscript>
  </body>
</html>
